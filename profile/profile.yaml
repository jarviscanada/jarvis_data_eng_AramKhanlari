# Jarvis projects
jarvis_projects:
  - name: "Python Data Analytics - London Gift Shop"
    git_url: "/python_data_analytics"
    description: "Delivered a data analytics proof of concept for a UK-based online retailer to support business growth and decision-making. Extracted, transformed, and analyzed transactional data using Python to identify sales patterns and perform customer segmentation after sensitive data was sanitized and transferred to Jarvis servers. Produced insights, visualizations, and presented a 10-minute executive summary, followed by feedback and discussion with leadership and peers."

  - name: "ETL pipeline in Databricks"
    git_url: "/databricks"
    description: "Analyzed over 10 years of credit card transaction data to detect fraud patterns, behavioral anomalies, and long-term risk trends. Designed and implemented a scalable data pipeline using the Medallion architecture (Bronze, Silver, Gold layers) to ingest raw data, perform cleansing and validation, and produce analytics-ready datasets. Leveraged distributed processing frameworks to handle large-scale datasets efficiently and ensure reliability across environments. Automated data workflows to streamline ingestion, transformation, and scheduled refresh cycles. Integrated the pipeline with dynamic dashboards that automatically updated visualizations and key performance indicators. Generated and refined analytical questions to uncover actionable insights that informed fraud detection strategies and risk mitigation efforts."

  - name: "Pyspark"
    git_url: "/spark"
    description: "Focused on Apache PySpark in distributed data processing environments. Rebuilt and scaled data analytics workflows that would normally run on a single machine, and made them suitable for larger datasets and production-like setups. Implemented using both Databricks and Zeppelin using Spark's structured APIs (DataFrames and SQL) to clean data, perform aggregations, and generate analytical insights efficiently."

  - name: "Java Grep Application"
    git_url: "/core_java"
    description: "Developed a Java application that mimics the Linux grep command to search matching strings within files, following a provided JavaGrep interface. Applied core Java concepts as part of the SDLC, including design, implementation, testing, and deployment. Performed manual testing, debugging via IDE tools, and optional JUnit tests. Packaged and distributed the application using the JVM, GitHub for source control, and Docker for deployment."

  - name: "Linux Cluster Resource Monitoring App"
    git_url: "/linux_sql"
    description: "Developed a Linux-based resource monitoring system on Rocky to collect CPU, memory, and disk usage metrics using Bash/Shell scripts and crontab. Containerized a PostgreSQL RDBMS using Docker to store host data and implemented analytical SQL queries for usage reporting and cluster health diagnostics. Followed a simplified SDLC to design, implement, test, and deploy the solution."

  - name: "SQL"
    git_url: "/sql"
    description: "Designed relational schemas, created DDL tables, loaded test data, and executed analytical SQL queries using PostgreSQL. Practiced joins, aggregations, filtering logic, and string manipulation to reinforce RDBMS concepts and query optimization techniques."

# Highlighted academic/personal projects
highlighted_projects:
  - name: "Broadcasting in Highly Connected Graphs"
    description: "Developed theoretical bounds and practical algorithms for efficient message dissemination in highly connected networks. Implemented simulations using Python, Pandas, and NetworkX, validated algorithmic performance across graph classes, and created data visualizations. Published findings in the Discrete Applied Mathematics Journal ([here](https://www.sciencedirect.com/science/article/pii/S0166218X25006493)) and completed as a Master's thesis.([here](https://spectrum.library.concordia.ca/id/eprint/992648/1/Khanlari_MCompSc_F2023.pdf))"

  - name: "Machine Learning Tools for Musical Harmonization"
    description: "Designed and trained Logistic Regression and RNN-based models to generate harmonic accompaniment for melodies. Collected and cleaned musical datasets, implemented preprocessing pipelines, evaluated accuracy with statistical metrics, and iteratively improved model performance. Awarded 'Best Paper' among 40+ submissions."

  - name: "Ant Colony Optimization for Routing"
    description: "Applied Ant Colony Optimization to solve Traveling Salesman and shortest-path problems. Implemented network structures and distributed ants as agents. Defined pheromone update rules, heuristic scoring, and convergence criteria using Python, NumPy, and NetworkX. Produced performance plots and data visuals in Jupyter."

