# Jarvis projects
jarvis_projects:
  - name: "Analyse de données Python - London Gift Shop"
    git_url: "/python_data_analytics"
    description: "Réalisation d'une preuve de concept en analyse de données pour un détaillant en ligne britannique afin de soutenir la croissance et la prise de décision stratégique. Extraction, transformation et analyse de données transactionnelles à l'aide de Python pour identifier des tendances de vente et segmenter les clients, après anonymisation et transfert sécurisé des données vers les serveurs Jarvis. Production de visualisations, d'analyses et présentation exécutive de 10 minutes suivie d'échanges avec la direction et les pairs."

  - name: "ETL pipeline in Databricks"
    git_url: "/databricks"
    description: "Analysé plus de 10 ans de données de transactions par carte de crédit afin de détecter des schémas de fraude, des anomalies comportementales et des tendances de risque à long terme. Conçu et mis en oeuvre un pipeline de données évolutif basé sur l'architecture Medallion (couches Bronze, Silver, Gold) pour ingérer les données brutes, effectuer le nettoyage et la validation, et produire des ensembles de données prêts pour l'analyse. Exploité des environnements de traitement distribué afin de gérer efficacement de grands volumes de données et d'assurer la fiabilité des traitements. Automatisé des flux de travail de bout en bout pour optimiser l'ingestion, la transformation et les cycles de mise à jour planifiés. Intégré le pipeline à des tableaux de bord dynamiques mettant automatiquement à jour les visualisations et les indicateurs clés de performance. Formulé et affiné des questions analytiques afin de générer des insights exploitables soutenant les stratégies de détection de fraude et de gestion des risques."

  - name: "Pyspark"
    git_url: "/spark"
    description: "Spécialisé dans Apache PySpark au sein d'environnements de traitement de données distribués. Refonte et mise à l'échelle de flux de travail d'analyse de données initialement conçus pour une seule machine, afin de les adapter à des ensembles de données plus volumineux et à des environnements proches de la production. Implémentation réalisée avec Databricks et Zeppelin en utilisant les API structurées de Spark (DataFrames et SQL) pour nettoyer les données, effectuer des agrégations et générer efficacement des analyses exploitables."
  - name: "Linux Cluster Resource Monitoring App"
    git_url: "/linux_sql"
    description: "Développé un système de surveillance des ressources sous Linux (Rocky) pour collecter les métriques d'utilisation du CPU, de la mémoire et du disque à l'aide de scripts Bash/Shell et de crontab. Conteneurisé une base de données relationnelle PostgreSQL avec Docker afin de stocker les données des hôtes, et mis en oeuvre des requêtes SQL analytiques pour les rapports d'utilisation et le diagnostic de l'état du cluster. Suivi un cycle de développement logiciel simplifié pour concevoir, implémenter, tester et déployer la solution."

  - name: "SQL"
    git_url: "/sql"
    description: "Conçu des schémas relationnels, créé des tables DDL, chargé des données de test et exécuté des requêtes SQL analytiques avec PostgreSQL. Mis en pratique les jointures, agrégations, filtres logiques et manipulations de chaînes afin de renforcer les concepts de SGBDR et les techniques d'optimisation de requêtes."

  - name: "Application Java Grep"
    git_url: "/core_java"
    description: "Développement d'une application Java reproduisant le comportement de la commande Linux grep pour la recherche de chaînes de caractères dans des fichiers, en respectant une interface JavaGrep fournie. Application des concepts fondamentaux de Java dans le cadre du cycle de vie du développement logiciel (SDLC). Réalisation de tests manuels, débogage via l'IDE et utilisation optionnelle de JUnit. Déploiement de l'application via la JVM, GitHub pour le contrôle de version et Docker pour la distribution."

# Highlighted academic/personal projects
highlighted_projects:
  - name: "Broadcasting in Highly Connected Graphs"
    description: "Développé des bornes théoriques et des algorithmes pratiques pour une diffusion efficace des messages dans des réseaux fortement connectés. Implémenté des simulations avec Python, Pandas et NetworkX, validé la performance algorithmique sur différentes classes de graphes et créé des visualisations de données. Publié les résultats dans le Discrete Applied Mathematics Journal ([ici](https://www.sciencedirect.com/science/article/pii/S0166218X25006493)) et publié dans le cadre d'un mémoire de maîtrise([ici](https://spectrum.library.concordia.ca/id/eprint/992648/1/Khanlari_MCompSc_F2023.pdf))."

  - name: "Machine Learning Tools for Musical Harmonization"
    description: "Conçu et entraîné des modèles de régression logistique et de réseaux neuronaux récurrents (RNN) pour générer un accompagnement harmonique à partir de mélodies. Collecté et nettoyé des ensembles de données musicales, implémenté des pipelines de prétraitement, évalué la précision avec des mesures statistiques et amélioré la performance des modèles de manière itérative. Récompensé du 'Best Paper' parmi plus de 40 soumissions."

  - name: "Ant Colony Optimization for Routing"
    description: "Appliqué l'optimisation par colonies de fourmis pour résoudre les problèmes du voyageur de commerce et de plus court chemin. Implémenté des structures de réseau et distribué des fourmis comme agents. Défini les règles de mise à jour des phéromones, les heuristiques et les critères de convergence à l'aide de Python, NumPy et NetworkX. Produits des graphiques de performance et des visualisations de données dans Jupyter."

